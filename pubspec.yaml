name: moviehub
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  dio: ^5.5.0+1
  get: ^4.6.6
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  dash_chat_2: any
  flutter_gemini: ^2.0.4
  image_picker: ^1.1.2
  flutter_floating_bottom_bar: ^1.2.0
  app_bar_with_search_switch: ^1.8.5
  floating_draggable_widget: ^2.1.5
  flutter_dotenv: ^5.1.0
  cached_network_image: ^3.3.1
  sliding_up_panel: ^2.0.0+1
  url_launcher: ^6.3.0
  flutter_markdown: ^0.7.3
  flutter_spinkit: ^5.2.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.0
  google_sign_in: 6.2.1
  flutter_secure_storage: ^8.1.0
  logger: ^2.4.0
  pull_to_refresh_flutter3: ^2.0.2
  screenshot: ^3.0.0
  share_plus: ^7.2.2
  path_provider: ^2.1.4
  flutter_staggered_animations: ^1.1.1
  flutter_animate: ^4.5.0
  carousel_slider: ^5.0.0
  rive: ^0.13.4
  line_awesome_flutter: ^3.0.1
  flutter_launcher_icons: ^0.13.1
  smooth_page_indicator: ^1.2.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: assets/icons/app_logo.png
  branding: assets/icons/app_logo.png
  color_dark: "#FFFFFF"
  image_dark: assets/icons/app_logo.png
  branding_dark: assets/icons/app_logo.png

  android_12:
    image: assets/icons/app_logo.png
    icon_background_color: "#ffffff"
    image_dark: assets/icons/app_logo.png
    icon_background_color_dark: "#FFFFFF"

  web: false
  android: false
  ios: false

dependency_overrides:
  win32: ^5.5.4
  google_sign_in: 6.2.1
  google_sign_in_android: 6.2.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/rive/
    - assets/images/onboard_image/
